name: test
on:
  push:
  pull_request:
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: schema
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: publicering
          extra-packages: any::testthat, any::withr
      - run: Rscript -e 'testthat::test_local("publicering", stop_on_failure = TRUE)'
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && node --test
        working-directory: schema
  webb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: webb/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Bara testfilerna i webb/tests/fixtures. 25 m-testerna hoppas över utan PERF_KLASSAD.
      - run: npx playwright test
